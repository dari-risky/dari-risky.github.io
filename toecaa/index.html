<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Pesan Buat Elsha... 🤍</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffd1dc 0%, #d8e2dc 50%, #ffe5ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Class khusus untuk menyembunyikan elemen */
        .hidden {
            display: none !important;
        }

        /* Partikel Melayang */
        .heart {
            position: absolute;
            font-size: 1.5rem;
            animation: floatUp 5s infinite linear;
            opacity: 0.7;
            user-select: none;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        /* Container Card */
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px 25px;
            width: 88%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.9);
            z-index: 10;
        }

        /* GIFs */
        .gif-box img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Fredoka', cursive;
            color: #ff6b8b;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        /* Pesan Typewriter */
        .message-box {
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 18px;
            font-size: 0.9rem;
            color: #555;
            line-height: 1.6;
            min-height: 120px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px dashed #ffb6c1;
            white-space: pre-line;
        }

        /* Tombol Start */
        .start-btn {
            background: #ff8fa3;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 15px 30px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 10px 20px rgba(255, 143, 163, 0.4);
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Tombol Aksi */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            min-height: 45px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-yes {
            background: #7bdff2;
            color: #1b4965;
            box-shadow: 0 5px 12px rgba(123, 223, 242, 0.4);
        }

        .btn-no {
            background: #ffadf2;
            color: #6b2d5c;
            position: absolute;
            right: 20px;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>

    <!-- BGM Audio (Menggunakan debu.mp3) -->
    <audio id="bgm" loop preload="auto">
        <source src="debu.mp3" type="audio/mpeg">
    </audio>

    <!-- Tombol Awal (Buka Surat) -->
    <div id="startScreen">
        <button class="start-btn" onclick="startExperience()">Buka Pesan 💌</button>
    </div>

    <!-- Card Utama (Pesan Maaf) -->
    <div class="container hidden" id="mainCard">
        <div class="gif-box">
            <img src="https://media.giphy.com/media/L95W4wv8nnb9K/giphy.gif" alt="Sad Cat">
        </div>
        <h1>Maafin Aku Ya? 🥺</h1>
        <div class="message-box" id="typewriter"></div>
        <div class="btn-group">
            <button class="btn btn-yes" onclick="forgiven()">Dimaafin ❤️</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Nggak</button>
        </div>
    </div>

    <!-- Card Akhir (Setelah Dimaafkan) -->
    <div class="container hidden" id="successCard">
        <div class="gif-box">
            <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Happy Cat">
        </div>
        <h1>Makasih Banyak! ✨</h1>
        <p style="color: #666; font-size: 0.95rem; margin-top: 10px;">
            Janji deh ga bakal bercanda berlebihan lagi. Makasih udah dimaafin yaaa! 🥰🤍
        </p>
    </div>

    <script>
        // TEKS UCAPAN KHUSUS BUAT ELSHA
        const textMessage = "allooo elcaa,aku mintaaa maappp,aku tadi cumaa mau bercandoo,\n\naku kiro elsha marahnya ga asliii,tadii aku kirim pesan tapi boong ny telatt udah diblokir dluann\n\nmaapinn yaaa,aku bercandaanya kelewatannnn,maapinnn yaaaaa🤍🤍";

        // Efek Hati Melayang
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const icons = ['🌸', '✨', '💖', '🤍', '🧸'];
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 350);

        // Fungsi Buka Pesan
        function startExperience() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('mainCard').classList.remove('hidden');

            const audio = document.getElementById('bgm');
            if (audio) {
                audio.play().catch(err => console.log("Audio autostart diproteksi browser"));
            }

            typeWriter();
        }

        // Efek Ketik Teks
        let i = 0;
        function typeWriter() {
            if (i < textMessage.length) {
                const char = textMessage.charAt(i);
                document.getElementById("typewriter").innerHTML += char === '\n' ? '<br>' : char;
                i++;
                setTimeout(typeWriter, 45);
            }
        }

        // Tombol "Nggak" Kabur
        function moveButton() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * 200 - 100;
            const y = Math.random() * 200 - 100;
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Ketika Tombol "Dimaafin" Diklik
        function forgiven() {
            document.getElementById('mainCard').classList.add('hidden');
            document.getElementById('successCard').classList.remove('hidden');

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
</body>
</html>
