<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Pesan Buat Kamu... 🤍</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffd1dc 0%, #d8e2dc 50%, #ffe5ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Partikel Melayang */
        .heart {
            position: absolute;
            font-size: 1.5rem;
            animation: floatUp 5s infinite linear;
            opacity: 0.7;
            user-select: none;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        /* Container Card */
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 30px 25px;
            width: 88%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.9);
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
        }

        .container.active {
            display: block;
            transform: scale(1);
            opacity: 1;
        }

        /* GIFs */
        .gif-box img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Fredoka', cursive;
            color: #ff6b8b;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        /* Pesan Typewriter */
        .message-box {
            background: rgba(255, 255, 255, 0.6);
            padding: 15px;
            border-radius: 18px;
            font-size: 0.9rem;
            color: #555;
            line-height: 1.6;
            min-height: 90px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px dashed #ffb6c1;
            white-space: pre-line;
        }

        /* Tombol Start Overlay */
        .start-btn {
            background: #ff8fa3;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 15px 30px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 10px 20px rgba(255, 143, 163, 0.4);
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Tombol Aksi */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            min-height: 45px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-yes {
            background: #7bdff2;
            color: #1b4965;
            box-shadow: 0 5px 12px rgba(123, 223, 242, 0.4);
        }

        .btn-no {
            background: #ffadf2;
            color: #6b2d5c;
            position: absolute;
            right: 20px;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>

    <audio id="bgm" loop>
        <source src="debu.mp3">
    </audio>

    <div id="startScreen">
        <button class="start-btn" onclick="startExperience()">Buka Pesan 💌</button>
    </div>

    <div class="container" id="mainCard">
        <div class="gif-box">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Zva2tsbXJqZDFkcnFkY2Nqd3R4eWVnYmxzcTBpZHF5YXNhZjJpbyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3T2OBm8S23vUY/giphy.gif" alt="Cute Sad">
        </div>
        <h1>Maafin Aku Ya? 🥺</h1>
        <div class="message-box" id="typewriter"></div>
        <div class="btn-group">
            <button class="btn btn-yes" onclick="forgiven()">Dimaafin ❤️</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Nggak</button>
        </div>
    </div>

    <div class="container" id="successCard">
        <div class="gif-box">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWtoNnhueWs4YjNvaHZscWFocnF0cGVydmF2eXVrdXRqOHFldXZubCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif" alt="Happy Cat">
        </div>
        <h1>Makasih Banyak! ✨</h1>
        <p style="color: #666; font-size: 0.95rem; margin-top: 10px;">
            Aku janji nggak bakal ngulangin lagi. Makasih udah mau ngertiin aku ya! 🥰
        </p>
    </div>

    <script>
        // Teks Ucapan (Bisa Diubah Bebas)
        const textMessage = "allooo elcaa,aku mintaaa maappp,aku tadi cumaa mau bercandoo,
aku kiro elsha marahnya ga asliii,tadii aku kirim pesan tapi boong ny telatt udah diblokir dluann
maapinn yaaa,aku bercandaanya kelewatannnn,maapinnn yaaaaa🤍🤍";

        // Fitur Partikel Melayang
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const icons = ['🌸', '✨', '💖', '🤍', '🧸'];
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 300);

        // Buka Pesan & Putar Musik
        function startExperience() {
            document.getElementById('startScreen').style.display = 'none';
            const card = document.getElementById('mainCard');
            card.classList.add('active');
            
            // Play Audio
            const audio = document.getElementById('bgm');
            audio.play().catch(e => console.log("Audio autostart blocked"));

            // Start Typewriter
            typeWriter();
        }

        // Efek Ketik Text
        let i = 0;
        function typeWriter() {
            if (i < textMessage.length) {
                document.getElementById("typewriter").innerHTML += textMessage.charAt(i) === '\n' ? '<br>' : textMessage.charAt(i);
                i++;
                setTimeout(typeWriter, 50);
            }
        }

        // Tombol Nggak Lari/Kabur
        function moveButton() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 120) - (window.innerWidth / 2 - 60);
            const y = Math.random() * (window.innerHeight - 120) - (window.innerHeight / 2 - 60);
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Ketika Dimaafkan
        function forgiven() {
            document.getElementById('mainCard').classList.remove('active');
            setTimeout(() => {
                document.getElementById('mainCard').style.display = 'none';
                const successCard = document.getElementById('successCard');
                successCard.classList.add('active');

                // Efek Confetti (Kembang Api Kertas)
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }, 300);
        }
    </script>
</body>
</html>
